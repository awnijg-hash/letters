<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #38bdf8 0%, #0284c7 40%, #0369a1 70%, #0f172a 100%);
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(2, 6, 23, 0.75) 0%, transparent 60%);
            opacity: 0;
            animation: darkWaveEffect 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes darkWaveEffect {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 0.85; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .game-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 2px;
            z-index: 2;
            position: relative;
        }

        #idleOverlayScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            overflow: hidden;
        }

        #idleOverlayScreen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .idle-top-banner {
            font-size: clamp(20px, 5vw, 36px);
            color: #FFD700;
            text-align: center;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 215, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 10;
            animation: bannerGlowPulse 1.5s infinite alternate ease-in-out;
        }

        @keyframes bannerGlowPulse {
            0% { transform: scale(1); filter: brightness(0.9); }
            100% { transform: scale(1.04); filter: brightness(1.2); }
        }

        #physicsContainer {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 100px);
            pointer-events: none;
        }

        .floating-cell {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            border: 3px solid #FFD700;
            color: #FFD700;
            border-radius: 12px;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 15px rgba(255, 215, 0, 0.5);
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: filter 0.2s ease;
        }

        .floating-cell:nth-child(even) {
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .floating-cell.shaking {
            animation: cellShake 0.3s ease infinite !important;
            border-color: #ef4444 !important;
        }

        @keyframes cellShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-2px, 1px) rotate(-2deg); }
            50% { transform: translate(2px, -1px) rotate(2deg); }
            75% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .floating-cell.expanding-launch {
            animation: none !important;
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            z-index: 10000;
            background: #FFD700 !important;
            color: #000 !important;
            border-color: #FFF !important;
            box-shadow: 0 0 100px #FFF, inset 0 0 50px #FFF !important;
            animation: intenseFlash 0.4s ease forwards;
        }

        @keyframes intenseFlash {
            0% { filter: brightness(1); transform: scaleX(0.8); }
            50% { filter: brightness(3); transform: scaleX(1); }
            100% { filter: brightness(2); transform: scaleX(1); }
        }

        /* 30 لفة كاملة (30 دورة * 360 درجة = 10800 درجة) مقسمة بالتساوي على مرحلتي التصغير والتكبير بلا أي توقف */
        .independent-spin {
            animation: thirtyLapsSpinAnimation 2.0s ease-in-out forwards;
            transform-origin: center center;
        }

        @keyframes thirtyLapsSpinAnimation {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(0) rotate(5400deg); /* 15 لفة مع تصغير متواصل حتى الصفر في المنتصف */
                opacity: 0;
            }
            50.1% {
                transform: scale(0) rotate(5400deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(10800deg); /* 15 لفة إضافية مع تكبير متواصل للعودة للنهاية (المجموع 30 لفة) */
                opacity: 1;
            }
        }

        .fs-btn {
            position: absolute;
            top: 2px;
            left: 4px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #1e293b;
            color: #fff;
            font-size: 0.5em;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
        }

        .top-panel-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2px;
            flex: 0 0 auto;
            margin-top: 16px;
        }

        .mode-bar-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 4px;
        }

        .mode-title-bar {
            flex: 2;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid #0284c7;
            color: #fff;
            font-size: 0.6em;
            text-align: center;
            padding: 3px 2px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0 #0369a1;
        }

        .mode-title-bar.active-mode {
            border: 2px solid #FFD700;
            background: rgba(30, 41, 59, 0.95);
            box-shadow: 0 3px 0 #b8860b, 0 0 12px rgba(255, 215, 0, 0.8);
            color: #FFD700;
        }

        .top-panel-wrapper {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            width: 100%;
            gap: 4px;
            min-width: 0;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            flex: 2;
            min-width: 0;
            gap: 2px;
            cursor: pointer;
        }

        .score-box {
            flex: 1;
            width: 100%;
            min-height: 75px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(2, 132, 199, 0.8);
            border-radius: 8px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 4px;
            box-shadow: 0 3px 0 rgba(2, 132, 199, 0.5);
            position: relative;
        }

        .score-box.winner-gold-border {
            border: 3px solid #FFD700 !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 1), inset 0 0 16px rgba(255, 215, 0, 0.9);
            animation: winnerBorderPulse 0.8s infinite alternate ease-in-out;
        }

        @keyframes winnerBorderPulse {
            0% { background: rgba(239, 68, 68, 0.6); }
            100% { background: rgba(239, 68, 68, 0.95); }
        }

        .center-art-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 1 40px;
            min-height: 75px;
            background: linear-gradient(135deg, #000084, #008080, #800080, #000084);
            border: 2px solid #FFD700;
            border-radius: 6px;
            box-shadow: 0 3px 0 #b8860b;
            cursor: pointer;
        }

        .stars-egg-carton {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 100%;
            height: 100%;
            padding: 2px;
            direction: rtl;
        }

        .star-row {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }

        .score-star-item {
            font-size: 1em;
            color: #FFD700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .balloons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 1px;
            width: 100%;
            flex: 1;
            margin: 1px 0;
        }

        .balloon {
            width: 100%;
            height: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 35% 30%, #ffffff, #a4b0be 50%, #2f3640 100%);
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            position: relative;
            overflow: hidden;
        }

        .balloon:nth-child(odd) {
            background: radial-gradient(circle at 35% 30%, #fffdf0, #e1b12c 50%, #7158e2 100%);
        }

        .balloon.column-green-glow {
            box-shadow: 0 0 14px #22c55e, inset 0 0 10px rgba(34, 197, 94, 0.9);
            border: 2px solid #4ade80;
        }

        .balloon.col-zero {
            background: radial-gradient(circle at 35% 30%, #4ade80, #15803d 60%, #064e3b 100%) !important;
        }

        .balloon.legendary-gold-pulse, .balloon.revealed.is-legendary {
            animation: giantStarGlow 0.8s infinite alternate !important;
            background: radial-gradient(circle at center, #ffffff 0%, #FFD700 40%, #b8860b 100%) !important;
            border: 3px solid #FFF !important;
            box-shadow: 0 0 35px #FFD700, 0 0 60px rgba(255, 215, 0, 0.8) !important;
            z-index: 10;
        }

        @keyframes giantStarGlow {
            0% { transform: scale(1); box-shadow: 0 0 25px #FFD700, 0 0 40px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.18); box-shadow: 0 0 55px #FFD700, 0 0 80px rgba(255, 215, 0, 1); }
        }

        .balloon-text {
            position: relative;
            z-index: 3;
            width: 96%;
            height: 96%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 900;
            color: #000000;
            font-size: 32px;
        }

        .inner-word-grid {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1px;
            position: absolute;
            z-index: 4;
            width: 95%;
            height: 95%;
        }

        .giant-star-display { font-size: 2.3em; color: #FFD700; }
        .balloon-star-item { font-size: 0.95em; color: #FFD700; }

        .balloon.revealed .balloon-text { display: none; }
        .balloon.revealed .inner-word-grid { display: flex; }
        .balloon.revealed { background: rgba(15, 23, 42, 0.4) !important; }

        .flying-word {
            position: fixed;
            font-size: 1.1em;
            z-index: 999;
            pointer-events: none;
            animation: flyToScore 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes flyToScore {
            0% { transform: scale(1.4) translate(0, 0); opacity: 1; }
            100% { transform: scale(0.6) translate(var(--destX), var(--destY)); opacity: 0.8; }
        }

        .star-particle {
            position: absolute;
            font-size: 0.9em;
            pointer-events: none;
            animation: burstStar 0.5s ease-out forwards;
        }

        @keyframes burstStar {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
        }

        .continuous-spark {
            position: absolute;
            font-size: 0.85em;
            pointer-events: none;
            z-index: 20;
            animation: borderSparkFly 0.45s linear infinite;
        }

        @keyframes borderSparkFly {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--bx), var(--by)) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="idleOverlayScreen" onclick="handleOverlayBackgroundClick(event)">
        <div class="idle-top-banner">
            🌹 أهلاً وسهلاً بكم في تحديات الأسماء والنجوم 🌹
        </div>
        <div id="physicsContainer"></div>
    </div>

    <div class="game-viewport" id="gameViewport">
        <button class="fs-btn" onclick="playKeyboardClick(); toggleFullScreen()">⛶ ملء الشاشة</button>

        <div class="top-panel-container">
            <div class="mode-bar-wrapper">
                <div class="mode-title-bar" id="barGolden" onclick="playKeyboardClick(); triggerKeyGameWithMix()">⭐ تحدي النجمة الذهبية</div>
                <div class="mode-title-bar active-mode" id="barCircles" onclick="playKeyboardClick(); setGameMode('numbers')">⭕ تحدي الثلاث دوائر</div>
            </div>

            <div class="top-panel-wrapper">
                <div class="side-column" onclick="playKeyboardClick(); setGameMode('numbers')">
                    <div class="score-box" id="container1">
                        <div id="side1Badges" class="stars-egg-carton"></div>
                    </div>
                </div>

                <div class="center-art-box" onclick="playKeyboardClick(); playCardShuffleSound(); toggleRevealAndMix()" title="كشف / تغطية وخلط"></div>

                <div class="side-column" onclick="playKeyboardClick(); triggerKeyGameWithMix()">
                    <div class="score-box" id="container2">
                        <div id="side2Badges" class="stars-egg-carton"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="balloons-grid" id="balloonsGrid"></div>
    </div>

    <script>
        let gameMode = 'numbers'; 
        let mode = 3; 
        let selectionsSide1 = [];
        let selectionsSide2 = [];
        let balloonsData = [];
        let gameActive = true;
        let currentTurnSide = 1; 
        let isRevealed = false; 
        let isTieBreaker = false; 
        let legendaryKeyFound = false;
        let continuousSparkInterval = null;

        let physicsCells = [];
        let physicsAnimFrame = null;
        let divisionTimer = null;

        let idleTimer = null;
        const IDLE_LIMIT = 10000; 

        function resetIdleTimer() {
            let overlay = document.getElementById('idleOverlayScreen');
            if (overlay.classList.contains('expanding-launch')) return;

            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                showIdleOverlay();
            }, IDLE_LIMIT);
        }

        function showIdleOverlay() {
            let overlay = document.getElementById('idleOverlayScreen');
            if (overlay.classList.contains('visible')) return;
            overlay.classList.add('visible');
            initPhysicsCells();
            startPhysicsLoop();
            startDivisionInterval();
        }

        function hideIdleOverlay() {
            let overlay = document.getElementById('idleOverlayScreen');
            overlay.classList.remove('visible');
            stopPhysicsLoop();
            stopDivisionInterval();
        }

        function playWaterDropSound() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            } catch (e) {}
        }

        function initPhysicsCells() {
            physicsCells = [];
            let container = document.getElementById('physicsContainer');
            container.innerHTML = '';

            let screenW = window.innerWidth;
            let screenH = window.innerHeight - 120;

            let initialData = [
                { type: 'numbers', text: 'تحدي الثلاث دوائر', w: Math.min(300, screenW * 0.4), h: 100 },
                { type: 'key', text: 'تحدي النجمة الذهبية', w: Math.min(300, screenW * 0.4), h: 100 }
            ];

            initialData.forEach((d, idx) => {
                let x = idx === 0 ? screenW * 0.1 : screenW * 0.55;
                let y = screenH * 0.3 + (Math.random() * 50);
                let vx = (Math.random() - 0.5) * 0.8;
                let vy = (Math.random() - 0.5) * 0.8;

                let el = document.createElement('div');
                el.className = 'floating-cell';
                el.style.width = d.w + 'px';
                el.style.height = d.h + 'px';
                el.innerText = d.text;
                el.style.fontSize = 'clamp(12px, 2.5vw, 20px)';
                el.onclick = (e) => selectIdleMode(d.type, e);

                container.appendChild(el);

                physicsCells.push({
                    x: x, y: y, vx: vx === 0 ? 0.3 : vx, vy: vy === 0 ? 0.3 : vy,
                    w: d.w, h: d.h, type: d.type, text: d.text, el: el
                });
            });
        }

        function startPhysicsLoop() {
            stopPhysicsLoop();
            function loop() {
                let container = document.getElementById('physicsContainer');
                if (!container) return;
                let maxW = container.clientWidth;
                let maxH = container.clientHeight;

                for (let i = 0; i < physicsCells.length; i++) {
                    let c = physicsCells[i];
                    c.x += c.vx;
                    c.y += c.vy;

                    if (c.x <= 0) { c.x = 0; c.vx *= -1; playWaterDropSound(); }
                    if (c.x + c.w >= maxW) { c.x = maxW - c.w; c.vx *= -1; playWaterDropSound(); }
                    if (c.y <= 0) { c.y = 0; c.vy *= -1; playWaterDropSound(); }
                    if (c.y + c.h >= maxH) { c.y = maxH - c.h; c.vy *= -1; playWaterDropSound(); }
                }

                for (let i = 0; i < physicsCells.length; i++) {
                    for (let j = i + 1; j < physicsCells.length; j++) {
                        let c1 = physicsCells[i];
                        let c2 = physicsCells[j];

                        if (c1.x < c2.x + c2.w && c1.x + c1.w > c2.x &&
                            c1.y < c2.y + c2.h && c1.y + c1.h > c2.y) {
                            
                            let tempVx = c1.vx;
                            let tempVy = c1.vy;
                            c1.vx = c2.vx;
                            c1.vy = c2.vy;
                            c2.vx = tempVx;
                            c2.vy = tempVy;

                            playWaterDropSound();

                            let overlapX = Math.min(c1.x + c1.w - c2.x, c2.x + c2.w - c1.x);
                            let overlapY = Math.min(c1.y + c1.h - c2.y, c2.y + c2.h - c1.y);
                            if (overlapX < overlapY) {
                                if (c1.x < c2.x) { c1.x -= overlapX / 2; c2.x += overlapX / 2; }
                                else { c1.x += overlapX / 2; c2.x -= overlapX / 2; }
                            } else {
                                if (c1.y < c2.y) { c1.y -= overlapY / 2; c2.y += overlapY / 2; }
                                else { c1.y += overlapY / 2; c2.y -= overlapY / 2; }
                            }
                        }
                    }
                }

                for (let i = 0; i < physicsCells.length; i++) {
                    let c = physicsCells[i];
                    c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
                }

                physicsAnimFrame = requestAnimationFrame(loop);
            }
            physicsAnimFrame = requestAnimationFrame(loop);
        }

        function stopPhysicsLoop() {
            if (physicsAnimFrame) {
                cancelAnimationFrame(physicsAnimFrame);
                physicsAnimFrame = null;
            }
        }

        function startDivisionInterval() {
            stopDivisionInterval();
            divisionTimer = setInterval(() => {
                let overlay = document.getElementById('idleOverlayScreen');
                if (!overlay.classList.contains('visible') || physicsCells.length >= 16) return;

                physicsCells.forEach(c => c.el.classList.add('shaking'));

                setTimeout(() => {
                    let newCells = [];
                    let container = document.getElementById('physicsContainer');
                    if (!container) return;

                    physicsCells.forEach(c => {
                        c.el.classList.remove('shaking');
                        c.el.remove();

                        let newW = c.w * 0.75;
                        let newH = c.h * 0.75;

                        for (let k = 0; k < 2; k++) {
                            let angle = Math.random() * Math.PI * 2;
                            let speed = 0.4 + Math.random() * 0.3;
                            let subEl = document.createElement('div');
                            subEl.className = 'floating-cell';
                            subEl.style.width = newW + 'px';
                            subEl.style.height = newH + 'px';
                            subEl.innerText = c.text;
                            subEl.style.fontSize = 'clamp(10px, 2vw, 16px)';
                            subEl.onclick = (e) => selectIdleMode(c.type, e);

                            container.appendChild(subEl);

                            newCells.push({
                                x: c.x + (k === 0 ? -10 : 10),
                                y: c.y + (k === 0 ? -10 : 10),
                                vx: Math.cos(angle) * speed,
                                vy: Math.sin(angle) * speed,
                                w: newW, h: newH, type: c.type, text: c.text, el: subEl
                            });
                        }
                    });

                    physicsCells = newCells;
                    playBalloonTone(7, 1);
                }, 300);

            }, 15000);
        }

        function stopDivisionInterval() {
            if (divisionTimer) {
                clearInterval(divisionTimer);
                divisionTimer = null;
            }
        }

        window.addEventListener('mousemove', (e) => {
            let overlay = document.getElementById('idleOverlayScreen');
            if (overlay.classList.contains('visible')) {
                initPhysicsCells();
                startDivisionInterval();
            }
            resetIdleTimer();
        }, { passive: true });

        window.addEventListener('wheel', (e) => {
            let overlay = document.getElementById('idleOverlayScreen');
            if (overlay.classList.contains('visible')) {
                initPhysicsCells();
                startDivisionInterval();
            }
            resetIdleTimer();
        }, { passive: true });

        ['keydown', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, resetIdleTimer, { passive: true });
        });

        let resultTimer = null;
        const RESULT_DELAY = 10000;

        function triggerResultTimer() {
            clearTimeout(resultTimer);
            resultTimer = setTimeout(() => {
                showIdleOverlay();
            }, RESULT_DELAY);
        }

        function cancelResultTimer() {
            clearTimeout(resultTimer);
        }

        function handleOverlayBackgroundClick(event) {
            if (event.target.id === 'idleOverlayScreen') {
                playKeyboardClick();
                hideIdleOverlay();
                resetIdleTimer();
            }
        }

        function selectIdleMode(modeType, event) {
            event.stopPropagation();
            playKeyboardClick();
            let cardElement = event.currentTarget;
            cardElement.classList.add('expanding-launch');
            
            setTimeout(() => {
                hideIdleOverlay();
                let overlay = document.getElementById('idleOverlayScreen');
                overlay.classList.remove('expanding-launch');

                if (modeType === 'numbers') {
                    setGameMode('numbers');
                } else {
                    triggerKeyGameWithMix();
                }
                resetIdleTimer();
            }, 400);
        }

        const fixedGridNames = [
            ["أَسعد", "أدم", "أحمد", "أمير"],       
            ["بهاء", "بدر", "بيان", "باسم"],       
            ["تيسير", "تهاني", "تركي", "تالا"],      
            ["ثامر", "ثريا", "ثروة", "ثمين"],     
            ["جمال", "جهاد", "جمانة", "جابر"],     
            ["حمد", "حلا", "حسن", "حاتم"],         
            ["خالد", "خولة", "خضر", "خالدة"],     
            ["داود", "ديمة", "دانا", "دريد"]       
        ];

        const balloonScale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 587.33];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function playKeyboardClick() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            } catch (e) {}
        }

        function playLegendaryGoldTone(isKeyMode = false) {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let baseFreq = balloonScale[7]; 
                let repeatCount = isKeyMode ? 4 : 1;
                
                for (let g = 0; g < repeatCount; g++) {
                    let groupStartTime = now + g * 0.9;
                    for (let n = 0; n < 4; n++) {
                        let startTime = groupStartTime + n * 0.15;
                        let masterGain = audioCtx.createGain();
                        masterGain.gain.setValueAtTime(0.65, startTime);
                        masterGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.06);
                        masterGain.connect(audioCtx.destination);
                        let osc = audioCtx.createOscillator();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(baseFreq, startTime);
                        osc.connect(masterGain);
                        osc.start(startTime);
                        osc.stop(startTime + 0.06);
                    }
                }
            } catch (e) {}
        }

        function playBalloonTone(starCount, repeatCount = 1) {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let index = Math.max(0, Math.min(starCount - 1, balloonScale.length - 1));
                let baseFreq = balloonScale[index];
                let masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.6, now);
                masterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                masterGain.connect(audioCtx.destination);
                let osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.4);
            } catch (e) {}
        }

        function playCardShuffleSound() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                for (let i = 0; i < 12; i++) {
                    let startTime = now + (i * 0.12);
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400 + (i * 45), startTime);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.09);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.09);
                }
            } catch (e) {}
        }

        function generateBalloonsData() {
            let pool = [];
            let legendaryIndex = Math.floor(Math.random() * 32);

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 4; col++) {
                    let i = (row * 4) + col;
                    let fixedName = fixedGridNames[row][col];
                    let wordObj;
                    if (i === legendaryIndex) {
                        wordObj = { count: 8, val: 8, name: "ثمانية" };
                    } else {
                        let randCount = Math.floor(Math.random() * 7) + 1;
                        let namesArr = ["واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة"];
                        wordObj = { count: randCount, val: randCount, name: namesArr[randCount - 1] };
                    }
                    pool.push({
                        id: i,
                        text: fixedName,
                        isName: true,
                        rowIndex: row,
                        colIndex: col, 
                        wordData: wordObj,
                        revealed: false,
                        selectedBySide: 0
                    });
                }
            }
            return pool;
        }

        function buildEggCartonScoreHTML(starsList) {
            let html = '';
            let currentRow = [];
            starsList.forEach((star, index) => {
                currentRow.push(star);
                if (currentRow.length === 5 || index === starsList.length - 1) {
                    html += `<div class="star-row">`;
                    currentRow.forEach(() => { html += `<span class="score-star-item">⭐</span>`; });
                    html += `</div>`;
                    currentRow = [];
                }
            });
            return html;
        }

        function buildBalloonStarsHTML(count, isLegendary) {
            if (isLegendary) return `<div class="giant-star-display">🌟</div>`;
            let html = '';
            for (let s = 0; s < count; s++) html += `<span class="balloon-star-item">⭐</span>`;
            return html;
        }

        function formatBalloonText(text) {
            if (text.includes(" ")) {
                let parts = text.split(" ");
                return `<span>${parts[0]}</span><span>${parts.slice(1).join(" ")}</span>`;
            }
            return `<span>${text}</span>`;
        }

        function renderBalloons(preserveRevealed = false) {
            const grid = document.getElementById('balloonsGrid');
            if (!preserveRevealed || balloonsData.length === 0) {
                balloonsData = generateBalloonsData();
            } else {
                let tempBalloons = generateBalloonsData();
                for(let i=0; i<32; i++) {
                    balloonsData[i].wordData = tempBalloons[i].wordData;
                    balloonsData[i].revealed = false; 
                    balloonsData[i].selectedBySide = 0;
                }
            }

            grid.innerHTML = '';
            isRevealed = false;
            legendaryKeyFound = false;
            stopContinuousSparks();

            for (let i = 0; i < 32; i++) {
                let item = balloonsData[i];
                let isLeg = (item.wordData.val === 8);
                let isColZero = (item.colIndex === 0); 
                let balloonStarsHTML = buildBalloonStarsHTML(item.wordData.count, isLeg);
                let formattedText = formatBalloonText(item.text);
                
                let classList = "balloon";
                if (isLeg && item.revealed) classList += " is-legendary";
                if (isColZero) classList += " col-zero"; 
                if (gameMode === 'key' && item.colIndex === 3) classList += " column-green-glow";
                if (item.revealed) classList += " revealed";

                grid.innerHTML += `
                    <div class="${classList}" id="balloon-${i}" onclick="handleBalloonClick(${i})">
                        <span class="balloon-text">${formattedText}</span>
                        <div class="inner-word-grid">${balloonStarsHTML}</div>
                    </div>`;
            }
        }

        function updateModeBarsUI() {
            let barGolden = document.getElementById('barGolden');
            let barCircles = document.getElementById('barCircles');
            barGolden.classList.remove('active-mode');
            barCircles.classList.remove('active-mode');
            if (gameMode === 'key') barGolden.classList.add('active-mode');
            else barCircles.classList.add('active-mode');
        }

        function triggerIndependentSpinAnimation(callback) {
            let elementsToSpin = [
                document.getElementById('barGolden'),
                document.getElementById('barCircles'),
                document.getElementById('container1').parentElement,
                document.querySelector('.center-art-box'),
                document.getElementById('container2').parentElement,
                document.getElementById('balloonsGrid')
            ];
            elementsToSpin.forEach(el => { if (el) el.classList.add('independent-spin'); });
            playCardShuffleSound();
            setTimeout(() => {
                if (callback) callback();
                elementsToSpin.forEach(el => { if (el) el.classList.remove('independent-spin'); });
                playBalloonTone(6, 1);
            }, 2000);
        }

        function toggleRevealAndMix() {
            cancelResultTimer();
            let grid = document.getElementById('balloonsGrid');
            let cards = document.querySelectorAll('.balloon');
            if (!isRevealed) {
                isRevealed = true;
                cards.forEach(card => {
                    card.classList.add('revealed');
                    let idx = card.id.split('-')[1];
                    balloonsData[idx].revealed = true;
                });
            } else {
                cards.forEach(card => card.classList.remove('revealed'));
                stopContinuousSparks();
                triggerIndependentSpinAnimation(() => { renderBalloons(true); });
            }
        }

        function handleBalloonClick(index) {
            if (!gameActive) return;
            if (gameMode === 'key' && legendaryKeyFound) return;
            
            cancelResultTimer(); 
            let item = balloonsData[index];
            let balloonEl = document.getElementById(`balloon-${index}`);

            if (gameMode === 'key') {
                openRowGradually(item.rowIndex);
            } else if (gameMode === 'numbers') {
                if (item.revealed) {
                    let sideOwner = item.selectedBySide;
                    if (sideOwner === 1) {
                        selectionsSide1 = selectionsSide1.filter(s => s.balloonId !== index);
                    } else if (sideOwner === 2) {
                        selectionsSide2 = selectionsSide2.filter(s => s.balloonId !== index);
                    }

                    item.revealed = false;
                    item.selectedBySide = 0;
                    balloonEl.classList.remove('revealed', 'is-legendary');
                    
                    let textSpan = balloonEl.querySelector('.balloon-text');
                    textSpan.className = "balloon-text";
                    textSpan.innerHTML = formatBalloonText(item.text);
                    textSpan.style.color = '#000000';

                    playKeyboardClick();
                    updateScoresDisplay();
                    return;
                }

                let sum1Count = selectionsSide1.length;
                let sum2Count = selectionsSide2.length;
                if (sum1Count >= mode && sum2Count >= mode && !isTieBreaker) {
                    return;
                }

                if (sum1Count < mode) {
                    currentTurnSide = 1;
                } else if (sum2Count < mode) {
                    currentTurnSide = 2;
                }

                if (item.wordData.val === 8) {
                    playLegendaryGoldTone(false);
                } else {
                    playBalloonTone(item.wordData.count, 1);
                }

                let textSpan = balloonEl.querySelector('.balloon-text');
                textSpan.className = "balloon-text"; 
                textSpan.innerHTML = `<span>${item.wordData.name}</span>`;
                textSpan.style.color = '#FFD700';

                setTimeout(() => {
                    balloonEl.classList.add('revealed');
                    item.revealed = true;
                    item.selectedBySide = currentTurnSide;
                    if (item.wordData.val === 8) {
                        balloonEl.classList.add('is-legendary');
                    }
                    createStarBurst(balloonEl, '#FFD700');
                    animateFlyingWord(balloonEl, item.wordData);

                    let recordObj = { val: item.wordData.val, count: item.wordData.count, balloonId: index };

                    if (isTieBreaker) {
                        if (currentTurnSide === 1) { 
                            selectionsSide1 = [recordObj]; 
                        } else {
                            selectionsSide2 = [recordObj]; 
                            if (selectionsSide1[0].val === selectionsSide2[0].val) {
                            } else {
                                isTieBreaker = false; 
                            }
                        }
                    } else {
                        if (currentTurnSide === 1) {
                            selectionsSide1.push(recordObj);
                        } else {
                            selectionsSide2.push(recordObj);
                            if (selectionsSide1.length >= mode && selectionsSide2.length >= mode) {
                                let sum1 = selectionsSide1.reduce((acc, w) => acc + w.val, 0);
                                let sum2 = selectionsSide2.reduce((acc, w) => acc + w.val, 0);
                                if (sum1 === sum2) { 
                                    isTieBreaker = true; 
                                    selectionsSide1 = [];
                                    selectionsSide2 = [];
                                    balloonsData.forEach(b => { b.revealed = false; b.selectedBySide = 0; });
                                    renderBalloons(true);
                                }
                            }
                        }
                    }
                    updateScoresDisplay();
                }, 250);
            }
        }

        function openRowGradually(rowIndex) {
            let startIndex = rowIndex * 4;
            for (let i = 0; i < 4; i++) {
                let balloonIdx = startIndex + i;
                let balloonEl = document.getElementById(`balloon-${balloonIdx}`);
                if (balloonEl && !balloonEl.classList.contains('revealed')) {
                    let wordData = balloonsData[balloonIdx].wordData;
                    setTimeout(() => {
                        if (legendaryKeyFound) return;
                        balloonEl.classList.add('revealed');
                        balloonsData[balloonIdx].revealed = true;
                        if (wordData.val === 8) {
                            playLegendaryGoldTone(true);
                            balloonEl.classList.add('legendary-gold-pulse');
                            balloonEl.querySelector('.inner-word-grid').innerHTML = buildBalloonStarsHTML(8, true);
                            legendaryKeyFound = true;
                            triggerResultTimer();
                        } else {
                            playBalloonTone(wordData.count, 1);
                        }
                    }, i * 300);
                }
            }
        }

        function triggerKeyGameWithMix() {
            cancelResultTimer();
            gameMode = 'key';
            updateModeBarsUI();
            stopContinuousSparks();
            triggerIndependentSpinAnimation(() => { resetGame(); });
        }

        function setGameMode(modeType) {
            cancelResultTimer();
            gameMode = modeType;
            updateModeBarsUI();
            stopContinuousSparks();
            triggerIndependentSpinAnimation(() => { resetGame(); });
        }

        function createStarBurst(element, color) {
            let rect = element.getBoundingClientRect();
            let parent = document.getElementById('gameViewport');
            for (let i = 0; i < 6; i++) {
                let star = document.createElement('div');
                star.className = 'star-particle';
                star.innerText = '⭐';
                star.style.left = `${rect.left + rect.width / 2}px`;
                star.style.top = `${rect.top + rect.height / 2}px`;
                let angle = (i * 60) * (Math.PI / 180);
                let distance = 30 + Math.random() * 15;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                parent.appendChild(star);
                setTimeout(() => star.remove(), 400);
            }
        }

        function animateFlyingWord(element, wordData) {
            let rect = element.getBoundingClientRect();
            let targetContainer = document.getElementById(currentTurnSide === 1 ? 'container1' : 'container2');
            let targetRect = targetContainer.getBoundingClientRect();
            let flyer = document.createElement('div');
            flyer.className = 'flying-word';
            let tempHTML = '';
            for(let s=0; s<wordData.count; s++) tempHTML += '⭐';
            flyer.innerHTML = tempHTML;
            flyer.style.left = `${rect.left}px`;
            flyer.style.top = `${rect.top}px`;
            flyer.style.setProperty('--destX', `${targetRect.left + 20 - rect.left}px`);
            flyer.style.setProperty('--destY', `${targetRect.top + 20 - rect.top}px`);
            document.body.appendChild(flyer);
            setTimeout(() => flyer.remove(), 600);
        }

        function stopContinuousSparks() {
            if (continuousSparkInterval) {
                clearInterval(continuousSparkInterval);
                continuousSparkInterval = null;
            }
        }

        function startContinuousBorderSparks(winningBoxElement) {
            stopContinuousSparks();
            continuousSparkInterval = setInterval(() => {
                let rect = winningBoxElement.getBoundingClientRect();
                for (let i = 0; i < 8; i++) {
                    let spark = document.createElement('div');
                    spark.className = 'continuous-spark';
                    spark.innerText = '✨';
                    let side = Math.floor(Math.random() * 4);
                    let startX = rect.left, startY = rect.top, bx = 0, by = 0;
                    if (side === 0) { startX = rect.left + Math.random() * rect.width; startY = rect.top - 3; bx = (Math.random() - 0.5) * 80; by = -35; }
                    else if (side === 1) { startX = rect.left + Math.random() * rect.width; startY = rect.bottom + 3; bx = (Math.random() - 0.5) * 80; by = 35; }
                    else if (side === 2) { startX = rect.right + 3; startY = rect.top + Math.random() * rect.height; bx = 35; by = (Math.random() - 0.5) * 80; }
                    else { startX = rect.left - 3; startY = rect.top + Math.random() * rect.height; bx = -35; by = (Math.random() - 0.5) * 80; }
                    spark.style.left = `${startX}px`;
                    spark.style.top = `${startY}px`;
                    spark.style.setProperty('--bx', `${bx}px`);
                    spark.style.setProperty('--by', `${by}px`);
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 450);
                }
            }, 35);
        }

        function updateScoresDisplay() {
            if (gameMode === 'key') return;
            let starsList1 = [], starsList2 = [];
            let sum1 = 0, sum2 = 0;
            selectionsSide1.forEach(word => { sum1 += word.val; for(let i=0; i<word.count; i++) starsList1.push('⭐'); });
            selectionsSide2.forEach(word => { sum2 += word.val; for(let i=0; i<word.count; i++) starsList2.push('⭐'); });

            document.getElementById('side1Badges').innerHTML = buildEggCartonScoreHTML(starsList1);
            document.getElementById('side2Badges').innerHTML = buildEggCartonScoreHTML(starsList2);

            let box1 = document.getElementById('container1');
            let box2 = document.getElementById('container2');
            box1.classList.remove('winner-gold-border');
            box2.classList.remove('winner-gold-border');

            if (selectionsSide1.length >= mode && selectionsSide2.length >= mode && !isTieBreaker) {
                if (sum1 > sum2) { box1.classList.add('winner-gold-border'); startContinuousBorderSparks(box1); }
                else if (sum2 > sum1) { box2.classList.add('winner-gold-border'); startContinuousBorderSparks(box2); }
                triggerResultTimer();
            } else {
                stopContinuousSparks();
            }
        }

        function resetGame() {
            cancelResultTimer();
            gameActive = true;
            legendaryKeyFound = false;
            stopContinuousSparks();
            selectionsSide1 = [];
            selectionsSide2 = [];
            currentTurnSide = 1;
            isTieBreaker = false;
            document.getElementById('side1Badges').innerHTML = '';
            document.getElementById('side2Badges').innerHTML = '';
            document.getElementById('container1').classList.remove('winner-gold-border');
            document.getElementById('container2').classList.remove('winner-gold-border');
            renderBalloons();
        }

        renderBalloons();
        updateModeBarsUI();
        resetIdleTimer();
    </script>
</body>
</html>
