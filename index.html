<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #38bdf8 0%, #0284c7 40%, #0369a1 70%, #0f172a 100%);
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(2, 6, 23, 0.75) 0%, transparent 60%);
            opacity: 0;
            animation: darkWaveEffect 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes darkWaveEffect {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 0.85; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .game-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 2px;
            z-index: 2;
            position: relative;
        }

        .independent-spin {
            animation: thirtyLapsSpinAnimation 2.0s ease-in-out forwards;
            transform-origin: center center;
        }

        @keyframes thirtyLapsSpinAnimation {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(0) rotate(5400deg); opacity: 0; }
            50.1% { transform: scale(0) rotate(5400deg); opacity: 0; }
            100% { transform: scale(1) rotate(10800deg); opacity: 1; }
        }

        .fs-btn {
            position: absolute;
            top: 2px;
            left: 4px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #1e293b;
            color: #fff;
            font-size: 0.5em;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
        }

        .top-panel-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2px;
            flex: 0 0 auto;
            margin-top: 16px;
        }

        .top-panel-wrapper {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            width: 100%;
            gap: 4px;
            min-width: 0;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            flex: 2;
            min-width: 0;
            gap: 2px;
            cursor: pointer;
        }

        .score-box {
            flex: 1;
            width: 100%;
            min-height: 75px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(2, 132, 199, 0.8);
            border-radius: 8px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 4px;
            box-shadow: 0 3px 0 rgba(2, 132, 199, 0.5);
            position: relative;
            transition: all 0.3s ease;
        }

        .stars-egg-carton {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 100%;
            height: 100%;
            padding: 2px;
            direction: rtl;
        }

        .star-row {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }

        .score-star-item {
            font-size: 1em;
            color: #FFD700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        /* إطار ضوئي نابض للدور الحالي */
        .score-box.active-turn-glow {
            border: 3px solid #38bdf8 !important;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.9), inset 0 0 10px rgba(56, 189, 248, 0.6);
            animation: activeTurnPulse 0.9s infinite alternate;
        }

        @keyframes activeTurnPulse {
            0% { transform: scale(1); border-color: #38bdf8; }
            100% { transform: scale(1.02); border-color: #ffffff; box-shadow: 0 0 25px rgba(255, 255, 255, 1); }
        }

        .score-box.mode-selector-box {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 2px solid #FFD700 !important;
            color: #FFD700 !important;
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 900;
            justify-content: center !important;
            align-items: center !important;
            text-align: center;
            box-shadow: 0 3px 0 #b8860b, 0 0 12px rgba(255, 215, 0, 0.6);
            animation: selectorPulse 1s infinite alternate;
        }

        @keyframes selectorPulse {
            0% { transform: scale(1); box-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
            100% { transform: scale(1.02); box-shadow: 0 0 16px rgba(255, 215, 0, 0.9); }
        }

        /* خانة الفائز: نبضة انتفاخ لمرة واحدة ثم ثبات اللون الأحمر والتوهج الذهبي */
        .score-box.winner-gold-border {
            border: 3px solid #FFD700 !important;
            background: rgba(239, 68, 68, 0.95) !important;
            box-shadow: 0 0 40px rgba(255, 215, 0, 1), inset 0 0 20px rgba(255, 215, 0, 0.9);
            animation: winnerPopOnce 0.4s ease forwards;
        }

        @keyframes winnerPopOnce {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .center-art-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 0 1 40px;
            min-height: 75px;
            background: linear-gradient(135deg, #000084, #008080, #800080, #000084);
            border: 2px solid #FFD700;
            border-radius: 6px;
            box-shadow: 0 3px 0 #b8860b;
            cursor: pointer;
        }

        .balloons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 1px;
            width: 100%;
            flex: 1;
            margin: 1px 0;
        }

        .balloon {
            width: 100%;
            height: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 35% 30%, #ffffff, #a4b0be 50%, #2f3640 100%);
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            position: relative;
            overflow: hidden;
        }

        .balloon:nth-child(odd) {
            background: radial-gradient(circle at 35% 30%, #fffdf0, #e1b12c 50%, #7158e2 100%);
        }

        .balloon.column-green-glow {
            box-shadow: 0 0 14px #22c55e, inset 0 0 10px rgba(34, 197, 94, 0.9);
            border: 2px solid #4ade80;
        }

        .balloon.col-zero {
            background: radial-gradient(circle at 35% 30%, #4ade80, #15803d 60%, #064e3b 100%) !important;
        }

        .balloon.legendary-gold-pulse, .balloon.revealed.is-legendary {
            animation: giantStarGlow 0.8s infinite alternate !important;
            background: radial-gradient(circle at center, #fff6b7 0%, #ffd700 45%, #b8860b 100%) !important;
            border: 3px solid #FFF !important;
            box-shadow: 0 0 35px #FFD700, 0 0 60px rgba(255, 215, 0, 0.8) !important;
            z-index: 10;
        }

        @keyframes giantStarGlow {
            0% { transform: scale(1); box-shadow: 0 0 25px #FFD700, 0 0 40px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.18); box-shadow: 0 0 55px #FFD700, 0 0 80px rgba(255, 215, 0, 1); }
        }

        .legendary-gold-pulse .giant-star-display, .balloon.revealed.is-legendary .giant-star-display {
            -webkit-text-stroke: 1.5px #7a5200;
            text-shadow: 0 0 10px #ffffff, 0 0 15px #ffcc00;
        }

        .balloon.numbers-star-mild {
            animation: mildFlash 0.5s ease forwards;
        }

        @keyframes mildFlash {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
            100% { filter: brightness(1); }
        }

        .balloon.numbers-star-mild .giant-star-display {
            animation: subtleStarMove 1.5s infinite ease-in-out alternate;
        }

        @keyframes subtleStarMove {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-3px) rotate(10deg); }
        }

        .balloon-text {
            position: relative;
            z-index: 3;
            width: 96%;
            height: 96%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 900;
            color: #000000;
            font-size: 32px;
        }

        .inner-word-grid {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1px;
            position: absolute;
            z-index: 4;
            width: 95%;
            height: 95%;
        }

        .giant-star-display { font-size: 2.3em; color: #FFD700; }
        .balloon-star-item { font-size: 0.95em; color: #FFD700; }

        .balloon.revealed .balloon-text { display: none; }
        .balloon.revealed .inner-word-grid { display: flex; }
        .balloon.revealed { background: rgba(15, 23, 42, 0.4) !important; }

        /* حركة النجوم الطائرة الملتزمة بالمسار الثابت حتى تتوقف وتتلاشى حصرياً في مركز الخانة المستهدفة */
        .flying-word {
            position: fixed;
            font-size: 1.2em;
            z-index: 999;
            pointer-events: none;
            left: 0;
            top: 0;
            animation: flyAlongFixedRoute 1.4s cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
        }

        @keyframes flyAlongFixedRoute {
            0% {
                transform: translate(var(--startX), var(--startY)) scale(1.2);
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--destX), var(--destY)) scale(0.05);
                opacity: 0;
            }
        }

        .star-particle {
            position: absolute;
            font-size: 0.9em;
            pointer-events: none;
            animation: burstStar 0.5s ease-out forwards;
        }

        @keyframes burstStar {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
        }

        .continuous-spark {
            position: absolute;
            font-size: 0.85em;
            pointer-events: none;
            z-index: 20;
            animation: borderSparkFly 0.45s linear infinite;
        }

        @keyframes borderSparkFly {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--bx), var(--by)) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-viewport" id="gameViewport">
        <button class="fs-btn" onclick="playKeyboardClick(); toggleFullScreen()">⛶ ملء الشاشة</button>

        <div class="top-panel-container">
            <div class="top-panel-wrapper">
                <!-- خانة السكور والنمط الأيمن (الأول) -->
                <div class="side-column" onclick="playKeyboardClick(); handleBoxClick('numbers')">
                    <div class="score-box mode-selector-box" id="container1">
                        تحدي الثلاث دوائر
                    </div>
                </div>

                <!-- زر الخلط الأوسط -->
                <div class="center-art-box" onclick="playKeyboardClick(); triggerCenterMixOnly()" title="خلط وتصفير السكورات"></div>

                <!-- خانة السكور والنمط الأيسر (الثاني) -->
                <div class="side-column" onclick="playKeyboardClick(); handleBoxClick('key')">
                    <div class="score-box mode-selector-box" id="container2">
                        تحدي النجمة الذهبية
                    </div>
                </div>
            </div>
        </div>

        <div class="balloons-grid" id="balloonsGrid"></div>
    </div>

    <script>
        let gameMode = 'numbers'; 
        let mode = 3; 
        let selectionsSide1 = [];
        let selectionsSide2 = [];
        let balloonsData = [];
        let gameActive = true;
        let currentTurnSide = 1; 
        let isTieBreaker = false; 
        let legendaryKeyFound = false;
        let continuousSparkInterval = null;
        let modeSelected = false; 
        let resultTriggered = false; 

        const fixedGridNames = [
            ["أَسعد", "أدم", "أحمد", "أمير"],       
            ["بهاء", "بدر", "بيان", "باسم"],       
            ["تيسير", "تهاني", "تركي", "تالا"],      
            ["ثامر", "ثريا", "ثروة", "ثمين"],     
            ["جمال", "جهاد", "جمانة", "جابر"],     
            ["حمد", "حلا", "حسن", "حاتم"],         
            ["خالد", "خولة", "خضر", "خالدة"],     
            ["داود", "ديمة", "دانا", "دريد"]       
        ];

        const balloonScale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 587.33];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function playKeyboardClick() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            } catch (e) {}
        }

        function playSurpriseSound() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.25);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.7);

                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.7);
            } catch (e) {}
        }

        function playLegendaryGoldTone(isKeyMode = false) {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let baseFreq = balloonScale[7]; 
                let repeatCount = isKeyMode ? 4 : 1;
                
                for (let g = 0; g < repeatCount; g++) {
                    let groupStartTime = now + g * 0.9;
                    for (let n = 0; n < 4; n++) {
                        let startTime = groupStartTime + n * 0.15;
                        let masterGain = audioCtx.createGain();
                        masterGain.gain.setValueAtTime(0.8, startTime);
                        masterGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.06);
                        masterGain.connect(audioCtx.destination);
                        let osc = audioCtx.createOscillator();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(baseFreq, startTime);
                        osc.connect(masterGain);
                        osc.start(startTime);
                        osc.stop(startTime + 0.06);
                    }
                }
            } catch (e) {}
        }

        function playBalloonTone(starCount, repeatCount = 1) {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let index = Math.max(0, Math.min(starCount - 1, balloonScale.length - 1));
                let baseFreq = balloonScale[index];
                let masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.75, now);
                masterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                masterGain.connect(audioCtx.destination);
                let osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.45);
            } catch (e) {}
        }

        function playCardShuffleSound() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                for (let i = 0; i < 12; i++) {
                    let startTime = now + (i * 0.12);
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400 + (i * 45), startTime);
                    gain.gain.setValueAtTime(0.3, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.09);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.09);
                }
            } catch (e) {}
        }

        function generateBalloonsData() {
            let pool = [];
            let legendaryIndex = Math.floor(Math.random() * 32);

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 4; col++) {
                    let i = (row * 4) + col;
                    let fixedName = fixedGridNames[row][col];
                    let wordObj;
                    if (i === legendaryIndex) {
                        wordObj = { count: 8, val: 8, name: "ثمانية" };
                    } else {
                        let randCount = Math.floor(Math.random() * 7) + 1;
                        let namesArr = ["واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة"];
                        wordObj = { count: randCount, val: randCount, name: namesArr[randCount - 1] };
                    }
                    pool.push({
                        id: i,
                        text: fixedName,
                        isName: true,
                        rowIndex: row,
                        colIndex: col, 
                        wordData: wordObj,
                        revealed: false,
                        selectedBySide: 0,
                        rowRevealed: false
                    });
                }
            }
            return pool;
        }

        function buildEggCartonScoreHTML(starsList) {
            let html = '';
            let currentRow = [];
            starsList.forEach((star, index) => {
                currentRow.push(star);
                if (currentRow.length === 5 || index === starsList.length - 1) {
                    html += `<div class="star-row">`;
                    currentRow.forEach(() => { html += `<span class="score-star-item">⭐</span>`; });
                    html += `</div>`;
                    currentRow = [];
                }
            });
            return html;
        }

        function buildBalloonStarsHTML(count, isLegendary) {
            if (isLegendary) return `<div class="giant-star-display">🌟</div>`;
            let html = '';
            for (let s = 0; s < count; s++) html += `<span class="balloon-star-item">⭐</span>`;
            return html;
        }

        function formatBalloonText(text) {
            if (text.includes(" ")) {
                let parts = text.split(" ");
                return `<span>${parts[0]}</span><span>${parts.slice(1).join(" ")}</span>`;
            }
            return `<span>${text}</span>`;
        }

        function renderBalloons() {
            const grid = document.getElementById('balloonsGrid');
            balloonsData = generateBalloonsData();

            grid.innerHTML = '';
            legendaryKeyFound = false;
            stopContinuousSparks();

            for (let i = 0; i < 32; i++) {
                let item = balloonsData[i];
                let isLeg = (item.wordData.val === 8);
                let isColZero = (item.colIndex === 0); 
                let balloonStarsHTML = buildBalloonStarsHTML(item.wordData.count, isLeg);
                let formattedText = formatBalloonText(item.text);
                
                let classList = "balloon";
                if (isColZero) classList += " col-zero"; 
                if (gameMode === 'key' && item.colIndex === 3) classList += " column-green-glow";

                grid.innerHTML += `
                    <div class="${classList}" id="balloon-${i}" onclick="handleBalloonClick(${i})">
                        <span class="balloon-text">${formattedText}</span>
                        <div class="inner-word-grid">${balloonStarsHTML}</div>
                    </div>`;
            }
        }

        function updateBoxesUI() {
            let box1 = document.getElementById('container1');
            let box2 = document.getElementById('container2');

            box1.classList.remove('winner-gold-border');
            box2.classList.remove('winner-gold-border');

            if (!modeSelected) {
                box1.className = "score-box mode-selector-box";
                box2.className = "score-box mode-selector-box";
                box1.innerHTML = "تحدي الثلاث دوائر";
                box2.innerHTML = "تحدي النجمة الذهبية";
            } else {
                box1.className = "score-box";
                box2.className = "score-box";
                box1.innerHTML = `<div id="side1Badges" class="stars-egg-carton"></div>`;
                box2.innerHTML = `<div id="side2Badges" class="stars-egg-carton"></div>`;
                updateScoresDisplay();
            }
        }

        function handleBoxClick(type) {
            gameMode = type;
            modeSelected = true; 
            resultTriggered = false;
            updateBoxesUI();
        }

        function triggerIndependentSpinAnimation(callback) {
            let elementsToSpin = [
                document.getElementById('container1'),
                document.querySelector('.center-art-box'),
                document.getElementById('container2'),
                document.getElementById('balloonsGrid')
            ];
            elementsToSpin.forEach(el => { if (el) el.classList.add('independent-spin'); });
            playCardShuffleSound();
            setTimeout(() => {
                if (callback) callback();
                elementsToSpin.forEach(el => { if (el) el.classList.remove('independent-spin'); });
                playBalloonTone(6, 1);
            }, 2000);
        }

        function triggerCenterMixOnly() {
            triggerIndependentSpinAnimation(() => {
                resetGame();
            });
        }

        function handleBalloonClick(index) {
            if (!modeSelected || !gameActive) return;
            
            let item = balloonsData[index];
            let balloonEl = document.getElementById(`balloon-${index}`);

            if (gameMode === 'key') {
                let rowIndex = item.rowIndex;
                let firstInRow = balloonsData[rowIndex * 4];
                if (firstInRow.rowRevealed) {
                    closeRowGradually(rowIndex);
                } else {
                    openRowGradually(rowIndex);
                }
            } else if (gameMode === 'numbers') {
                if (item.revealed) {
                    let sideOwner = item.selectedBySide;
                    if (sideOwner === 1) {
                        selectionsSide1 = selectionsSide1.filter(s => s.balloonId !== index);
                    } else if (sideOwner === 2) {
                        selectionsSide2 = selectionsSide2.filter(s => s.balloonId !== index);
                    }

                    item.revealed = false;
                    item.selectedBySide = 0;
                    balloonEl.classList.remove('revealed', 'is-legendary', 'numbers-star-mild');
                    
                    let textSpan = balloonEl.querySelector('.balloon-text');
                    textSpan.className = "balloon-text";
                    textSpan.innerHTML = formatBalloonText(item.text);
                    textSpan.style.color = '#000000';

                    resultTriggered = false; 
                    playKeyboardClick();
                    updateScoresDisplay();
                    return;
                }

                let sum1Count = selectionsSide1.length;
                let sum2Count = selectionsSide2.length;
                
                if (sum1Count < mode) {
                    currentTurnSide = 1;
                } else if (sum2Count < mode) {
                    currentTurnSide = 2;
                } else {
                    return; 
                }

                playBalloonTone(item.wordData.count, 1);

                let textSpan = balloonEl.querySelector('.balloon-text');
                textSpan.className = "balloon-text"; 
                textSpan.innerHTML = `<span>${item.wordData.name}</span>`;
                textSpan.style.color = '#FFD700';

                setTimeout(() => {
                    balloonEl.classList.add('revealed');
                    item.revealed = true;
                    item.selectedBySide = currentTurnSide;
                    
                    if (item.wordData.val === 8) {
                        balloonEl.classList.add('numbers-star-mild');
                    }

                    createStarBurst(balloonEl, '#FFD700');
                    animateFlyingWord(balloonEl, item.wordData, currentTurnSide);

                    let recordObj = { val: item.wordData.val, count: item.wordData.count, balloonId: index };

                    if (currentTurnSide === 1) {
                        selectionsSide1.push(recordObj);
                    } else {
                        selectionsSide2.push(recordObj);
                    }

                    updateScoresDisplay();
                }, 250);
            }
        }

        function openRowGradually(rowIndex) {
            let startIndex = rowIndex * 4;
            balloonsData[startIndex].rowRevealed = true;
            for (let i = 0; i < 4; i++) {
                let balloonIdx = startIndex + i;
                let balloonEl = document.getElementById(`balloon-${balloonIdx}`);
                if (balloonEl) {
                    let wordData = balloonsData[balloonIdx].wordData;
                    setTimeout(() => {
                        balloonEl.classList.add('revealed');
                        balloonsData[balloonIdx].revealed = true;
                        if (wordData.val === 8) {
                            playLegendaryGoldTone(true);
                            balloonEl.classList.add('legendary-gold-pulse'); 
                            balloonEl.querySelector('.inner-word-grid').innerHTML = buildBalloonStarsHTML(8, true);
                            legendaryKeyFound = true;
                        } else {
                            playBalloonTone(wordData.count, 1);
                        }
                    }, i * 300);
                }
            }
        }

        function closeRowGradually(rowIndex) {
            let startIndex = rowIndex * 4;
            balloonsData[startIndex].rowRevealed = false;
            for (let i = 0; i < 4; i++) {
                let balloonIdx = startIndex + i;
                let balloonEl = document.getElementById(`balloon-${balloonIdx}`);
                let item = balloonsData[balloonIdx];
                if (balloonEl) {
                    item.revealed = false;
                    balloonEl.classList.remove('revealed', 'legendary-gold-pulse', 'is-legendary');
                    let textSpan = balloonEl.querySelector('.balloon-text');
                    textSpan.className = "balloon-text";
                    textSpan.innerHTML = formatBalloonText(item.text);
                    textSpan.style.color = '#000000';
                }
            }
            playKeyboardClick();
        }

        function createStarBurst(element, color) {
            let rect = element.getBoundingClientRect();
            let parent = document.getElementById('gameViewport');
            for (let i = 0; i < 6; i++) {
                let star = document.createElement('div');
                star.className = 'star-particle';
                star.innerText = '⭐';
                star.style.left = `${rect.left + rect.width / 2}px`;
                star.style.top = `${rect.top + rect.height / 2}px`;
                let angle = (i * 60) * (Math.PI / 180);
                let distance = 30 + Math.random() * 15;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                parent.appendChild(star);
                setTimeout(() => star.remove(), 400);
            }
        }

        /* نظام النقاط المرجعية الثابتة ورسم المسار الموجه حصرياً لمركز خانة اللاعب المعني دون تجاوز أو انحراف */
        function animateFlyingWord(element, wordData, turnSide) {
            let rect = element.getBoundingClientRect();
            
            // تحديد نقطة المرجع الثابتة المطلقة لخانة سكور اللاعب حصرياً
            let targetContainer = document.getElementById(turnSide === 1 ? 'container1' : 'container2');
            let targetRect = targetContainer.getBoundingClientRect();

            let flyer = document.createElement('div');
            flyer.className = 'flying-word';
            let tempHTML = '';
            for(let s=0; s<wordData.count; s++) tempHTML += '⭐';
            flyer.innerHTML = tempHTML;

            // إحداثيات نقطة البداية (مركز الدائرة المفتوحة)
            let startX = rect.left + (rect.width / 2);
            let startY = rect.top + (rect.height / 2);
            
            // الإحداثيات الدقيقة لمركز خانة السكور (نقطة الوصول الثابتة للمسار)
            let destX = (targetRect.left + (targetRect.width / 2)) - startX;
            let destY = (targetRect.top + (targetRect.height / 2)) - startY;

            flyer.style.setProperty('--startX', `${startX}px`);
            flyer.style.setProperty('--startY', `${startY}px`);
            flyer.style.setProperty('--destX', `${destX}px`);
            flyer.style.setProperty('--destY', `${destY}px`);

            document.body.appendChild(flyer);
            setTimeout(() => flyer.remove(), 1400); // حركة بطيئة ومضبوطة تنتهي وتتلاشى بدقة متناهية في مركز الخانة
        }

        function stopContinuousSparks() {
            if (continuousSparkInterval) {
                clearInterval(continuousSparkInterval);
                continuousSparkInterval = null;
            }
        }

        function startContinuousBorderSparks(winningBoxElement) {
            stopContinuousSparks();
            continuousSparkInterval = setInterval(() => {
                let rect = winningBoxElement.getBoundingClientRect();
                for (let i = 0; i < 8; i++) {
                    let spark = document.createElement('div');
                    spark.className = 'continuous-spark';
                    spark.innerText = '✨';
                    let side = Math.floor(Math.random() * 4);
                    let startX = rect.left, startY = rect.top, bx = 0, by = 0;
                    if (side === 0) { startX = rect.left + Math.random() * rect.width; startY = rect.top - 3; bx = (Math.random() - 0.5) * 80; by = -35; }
                    else if (side === 1) { startX = rect.left + Math.random() * rect.width; startY = rect.bottom + 3; bx = (Math.random() - 0.5) * 80; by = 35; }
                    else if (side === 2) { startX = rect.right + 3; startY = rect.top + Math.random() * rect.height; bx = 35; by = (Math.random() - 0.5) * 80; }
                    else { startX = rect.left - 3; startY = rect.top + Math.random() * rect.height; bx = -35; by = (Math.random() - 0.5) * 80; }
                    spark.style.left = `${startX}px`;
                    spark.style.top = `${startY}px`;
                    spark.style.setProperty('--bx', `${bx}px`);
                    spark.style.setProperty('--by', `${by}px`);
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 450);
                }
            }, 35);
        }

        function triggerScreenSurpriseEffect() {
            if (resultTriggered) return;
            resultTriggered = true;
            playSurpriseSound();
        }

        function updateScoresDisplay() {
            if (gameMode === 'key' || !modeSelected) return;
            let starsList1 = [], starsList2 = [];
            let sum1 = 0, sum2 = 0;
            selectionsSide1.forEach(word => { sum1 += word.val; for(let i=0; i<word.count; i++) starsList1.push('⭐'); });
            selectionsSide2.forEach(word => { sum2 += word.val; for(let i=0; i<word.count; i++) starsList2.push('⭐'); });

            let box1 = document.getElementById('container1');
            let box2 = document.getElementById('container2');

            box1.innerHTML = `<div id="side1Badges" class="stars-egg-carton">${buildEggCartonScoreHTML(starsList1)}</div>`;
            box2.innerHTML = `<div id="side2Badges" class="stars-egg-carton">${buildEggCartonScoreHTML(starsList2)}</div>`;

            box1.classList.remove('winner-gold-border', 'active-turn-glow');
            box2.classList.remove('winner-gold-border', 'active-turn-glow');

            if (selectionsSide1.length >= mode && selectionsSide2.length >= mode) {
                triggerScreenSurpriseEffect(); 
                if (sum1 > sum2) { 
                    box1.classList.add('winner-gold-border'); 
                    startContinuousBorderSparks(box1); 
                } else if (sum2 > sum1) { 
                    box2.classList.add('winner-gold-border'); 
                    startContinuousBorderSparks(box2); 
                }
            } else {
                stopContinuousSparks();
                let sum1Count = selectionsSide1.length;
                let sum2Count = selectionsSide2.length;
                if (sum1Count < mode) {
                    box1.classList.add('active-turn-glow');
                } else if (sum2Count < mode) {
                    box2.classList.add('active-turn-glow');
                }
            }
        }

        function resetGame() {
            gameActive = true;
            legendaryKeyFound = false;
            stopContinuousSparks();
            selectionsSide1 = [];
            selectionsSide2 = [];
            currentTurnSide = 1;
            isTieBreaker = false;
            modeSelected = false; 
            resultTriggered = false;
            updateBoxesUI();
            renderBalloons();
        }

        renderBalloons();
        updateBoxesUI();
    </script>
</body>
</html>
